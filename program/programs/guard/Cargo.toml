[package]
name = "guard"
version = "0.1.0"
description = "Policy-constrained Kamino repay guard"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "guard"

[features]
default = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

# `solana-program` stays pinned to the exact version Anchor.toml declares. The
# LiteSVM harness needs the 2.2 host runtime and cannot unify with this pin, so it
# does not depend on this crate at all — see tests/litesvm-harness/Cargo.toml.
[dependencies]
anchor-lang = { workspace = true }
anchor-spl.workspace = true
solana-program.workspace = true
uint.workspace = true

[dev-dependencies]
proptest = "1.7"
# Only to read vectors/ltv-bps.json in unit tests; never reaches the SBF binary.
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug"))',
] }
