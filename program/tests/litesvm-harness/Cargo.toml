[package]
name = "guard-litesvm-tests"
version = "0.1.0"
edition = "2021"
publish = false

# A standalone workspace keeps LiteSVM's Solana 2.2 host-runtime graph out of the
# on-chain Cargo.lock consumed by Solana 2.1.7's Rust 1.79 SBF toolchain.
[workspace]

# Deliberately NOT depending on the `guard` crate. That crate pins
# `solana-program = "=2.1.7"` because the SBF toolchain requires it, and LiteSVM
# needs >= 2.2 — the two cannot be unified in one dependency graph.
#
# The harness therefore talks to the program the way any external client does: over
# the compiled `guard.so`, hand-packed account bytes and raw discriminators. That is
# a feature, not a workaround. Tests that reuse the program's own constants and
# serialisation cannot detect a change in either; these tests can.
[dependencies]
litesvm = "0.6"
solana-account = "2.2"
solana-clock = "2.2"
solana-instruction = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-pubkey = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-transaction-error = "2.2"
