[workspace]
members = ["programs/guard"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.79"

[workspace.dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"
solana-program = "=2.1.7"
uint = { version = "0.9.5", default-features = false }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
